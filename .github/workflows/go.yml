name: Go

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Vet and build
        run: |
          go vet ./...
          go build ./...
